<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112A4F" />
      <stop offset="50%" stop-color="#142238" />
      <stop offset="100%" stop-color="#1A1C20" />
    </linearGradient>
    <linearGradient id="skinGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#dba885" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowAi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#aiBgGrad)" />
  
  <!-- Neural Network Halo Rings -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="rgba(48, 130, 210, 0.25)" stroke-width="1.5" />
  
  <!-- Long Hair Behind -->
  <path d="M 130 180 C 120 280 130 360 140 400 L 260 400 C 270 360 280 280 270 180 Z" fill="#18181b" />
  
  <!-- Body/Blazer -->
  <path d="M 95 400 C 95 325 145 285 200 285 C 255 285 305 325 305 400 Z" fill="#1e1b4b" />
  <path d="M 140 400 L 175 320 L 200 365 L 225 320 L 260 400 Z" fill="#312e81" />
  <polygon points="175,320 200,365 225,320 200,340" fill="#3082D2" />
  
  <!-- Neck -->
  <rect x="186" y="240" width="28" height="48" rx="6" fill="url(#skinGradF)" />
  
  <!-- Head -->
  <ellipse cx="200" cy="190" rx="55" ry="68" fill="url(#skinGradF)" />
  
  <!-- Hair Front -->
  <path d="M 135 180 C 130 115 160 90 200 90 C 240 90 270 115 265 180 C 260 130 235 110 200 110 C 165 110 140 130 135 180 Z" fill="#09090b" />
  <path d="M 135 170 C 135 220 145 250 155 270 C 150 240 142 200 145 170 Z" fill="#18181b" />
  <path d="M 265 170 C 265 220 255 250 245 270 C 250 240 258 200 255 170 Z" fill="#18181b" />
  
  <!-- Eyes -->
  <circle cx="178" cy="184" r="5" fill="#1e1b4b" />
  <circle cx="222" cy="184" r="5" fill="#1e1b4b" />
  <circle cx="180" cy="182" r="1.8" fill="#ffffff" />
  <circle cx="224" cy="182" r="1.8" fill="#ffffff" />
  
  <!-- Eyebrows & Lashes -->
  <path d="M 166 174 Q 178 170 188 175" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 212 175 Q 222 170 234 174" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Smile -->
  <path d="M 187 222 Q 200 232 213 222" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- AI Neural Chip Badge -->
  <g transform="translate(300, 40)" filter="url(#glowAi)">
    <circle cx="20" cy="20" r="22" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
    <circle cx="20" cy="15" r="3" fill="#a855f7" />
    <circle cx="14" cy="25" r="3" fill="#3082D2" />
    <circle cx="26" cy="25" r="3" fill="#38bdf8" />
    <line x1="20" y1="15" x2="14" y2="25" stroke="#a855f7" stroke-width="1.5" />
    <line x1="20" y1="15" x2="26" y2="25" stroke="#a855f7" stroke-width="1.5" />
    <line x1="14" y1="25" x2="26" y2="25" stroke="#a855f7" stroke-width="1.5" />
  </g>
</svg>
