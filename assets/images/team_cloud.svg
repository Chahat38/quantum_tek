<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112A4F" />
      <stop offset="50%" stop-color="#142238" />
      <stop offset="100%" stop-color="#1A1C20" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b997" />
      <stop offset="100%" stop-color="#c99b79" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3082D2" />
      <stop offset="100%" stop-color="#206AB6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Ambient Circuit Ring -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="rgba(48, 130, 210, 0.25)" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="rgba(48, 130, 210, 0.2)" stroke-width="1.5" />
  
  <!-- Body/Suit -->
  <path d="M 100 400 C 100 320 150 280 200 280 C 250 280 300 320 300 400 Z" fill="#1e293b" />
  <path d="M 150 400 L 180 320 L 200 350 L 220 320 L 250 400 Z" fill="#0f172a" />
  <polygon points="190,320 210,320 205,370 195,370" fill="url(#limeGrad)" />
  <polygon points="180,310 200,340 185,340" fill="#ffffff" />
  <polygon points="220,310 200,340 215,340" fill="#ffffff" />
  
  <!-- Neck -->
  <rect x="185" y="240" width="30" height="45" rx="5" fill="url(#skinGrad)" />
  
  <!-- Head -->
  <ellipse cx="200" cy="190" rx="60" ry="72" fill="url(#skinGrad)" />
  
  <!-- Modern Hair -->
  <path d="M 138 180 C 135 125 160 100 200 100 C 240 100 265 125 262 180 C 255 140 240 120 200 120 C 160 120 145 140 138 180 Z" fill="#18181b" />
  <path d="M 140 170 C 135 150 145 120 180 110 C 220 100 255 120 260 150 C 245 130 220 125 180 130 C 155 135 145 155 140 170 Z" fill="#27272a" />
  
  <!-- Trimmed Beard -->
  <path d="M 155 200 C 160 255 240 255 245 200 C 245 235 225 255 200 255 C 175 255 155 235 155 200 Z" fill="#18181b" opacity="0.85" />
  
  <!-- Modern Glasses -->
  <rect x="155" y="172" width="38" height="26" rx="6" fill="none" stroke="#3082D2" stroke-width="3" filter="url(#glow)" />
  <rect x="207" y="172" width="38" height="26" rx="6" fill="none" stroke="#3082D2" stroke-width="3" filter="url(#glow)" />
  <line x1="193" y1="185" x2="207" y2="185" stroke="#3082D2" stroke-width="3" />
  <line x1="145" y1="182" x2="155" y2="182" stroke="#3082D2" stroke-width="2.5" />
  <line x1="245" y1="182" x2="255" y2="182" stroke="#3082D2" stroke-width="2.5" />
  
  <!-- Eyes behind glasses -->
  <circle cx="174" cy="185" r="4.5" fill="#09090b" />
  <circle cx="226" cy="185" r="4.5" fill="#09090b" />
  <circle cx="176" cy="183" r="1.5" fill="#ffffff" />
  <circle cx="228" cy="183" r="1.5" fill="#ffffff" />
  
  <!-- Smile -->
  <path d="M 185 226 Q 200 236 215 226" fill="none" stroke="#6d4c41" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Cloud Tech Badge Indicator -->
  <g transform="translate(300, 40)" filter="url(#glow)">
    <circle cx="20" cy="20" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <path d="M 12 24 A 6 6 0 0 1 20 16 A 8 8 0 0 1 30 20 A 5 5 0 0 1 28 26 L 12 26 Z" fill="#38bdf8" />
  </g>
</svg>
