<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="devBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112A4F" />
      <stop offset="50%" stop-color="#142238" />
      <stop offset="100%" stop-color="#1A1C20" />
    </linearGradient>
    <linearGradient id="skinGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2c8a2" />
      <stop offset="100%" stop-color="#d49f75" />
    </linearGradient>
    <filter id="glowDev" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#devBgGrad)" />
  
  <!-- Ambient Circuit Rings -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="rgba(48, 130, 210, 0.25)" stroke-width="2" stroke-dasharray="10 6" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="rgba(48, 130, 210, 0.2)" stroke-width="1.5" />
  
  <!-- Body/Modern Tech Hoodie & Shirt -->
  <path d="M 90 400 C 90 320 145 285 200 285 C 255 285 310 320 310 400 Z" fill="#18181b" />
  <path d="M 145 400 L 175 325 L 200 360 L 225 325 L 255 400 Z" fill="#27272a" />
  <path d="M 175 325 L 200 360 L 225 325 Z" fill="#3082D2" />
  
  <!-- Neck -->
  <rect x="185" y="240" width="30" height="48" rx="6" fill="url(#skinGradM)" />
  
  <!-- Head -->
  <ellipse cx="200" cy="188" rx="58" ry="70" fill="url(#skinGradM)" />
  
  <!-- Modern Hairstyle -->
  <path d="M 140 175 C 135 110 165 85 205 85 C 245 85 268 110 262 175 C 255 130 235 105 200 105 C 160 105 145 130 140 175 Z" fill="#09090b" />
  <path d="M 145 140 C 160 100 220 90 250 120 C 230 110 180 115 155 145 Z" fill="#27272a" />
  
  <!-- Stylish Short Stubble -->
  <path d="M 160 210 C 165 255 235 255 240 210 C 240 238 222 254 200 254 C 178 254 160 238 160 210 Z" fill="#18181b" opacity="0.75" />
  
  <!-- Eyes -->
  <circle cx="176" cy="184" r="4.5" fill="#18181b" />
  <circle cx="224" cy="184" r="4.5" fill="#18181b" />
  <circle cx="178" cy="182" r="1.5" fill="#ffffff" />
  <circle cx="226" cy="182" r="1.5" fill="#ffffff" />
  
  <!-- Eyebrows -->
  <path d="M 164 172 Q 176 168 186 172" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 214 172 Q 224 168 236 172" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Smile -->
  <path d="M 186 224 Q 200 234 214 224" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Code Brackets Badge -->
  <g transform="translate(300, 40)" filter="url(#glowDev)">
    <circle cx="20" cy="20" r="22" fill="#18181b" stroke="#3082D2" stroke-width="2" />
    <path d="M 16 15 L 11 20 L 16 25" fill="none" stroke="#3082D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 24 15 L 29 20 L 24 25" fill="none" stroke="#3082D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="21" y1="13" x2="19" y2="27" stroke="#3082D2" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
